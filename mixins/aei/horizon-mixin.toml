[mod]
id = "aei"
version = "0.1.5"
priority = 100

# Compatibility with the published native hooks used by AEI.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "aei"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "aei_glue"
source = "glue.rs"

[[module]]
id = "center_recipe"
file = "crates/horizon-client/src/game/native_panel.rs"
name = "aei_recipe_overlay"
source = "centered_recipe_overlay.rs"

[[module]]
id = "recipe_paint"
file = "crates/horizon-client/src/game/native_panel.rs"
name = "aei_recipe_paint"
source = "recipe_paint.rs"

[[injection]]
id = "creative_panel"
kind = "MODIFY_EXPRESSION_VALUE"
target = "horizon_client::game::native_panel::Game<'_>::browser_sync"
selector = 'self.screen == Screen::Creative && of.0.native_id() != "recipes"'
require = 1
ordinal = 0
helper = "creative_panel.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "owner", ty = "&(Owner, u64)", value = "$local_ref:of:0" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "event"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_panel_event"
helper = "event.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "event", ty = "&crate::game::native_hooks::NativePanelEvent", value = "event" },
]

[[injection]]
id = "center_recipe_draw"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_panel::Game<'_>::draw_mod_browser"
helper = "centered_recipe_draw.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "center_recipe_press"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_panel::Game<'_>::mod_browser_press"
helper = "centered_recipe_press.rs"
bindings = [
