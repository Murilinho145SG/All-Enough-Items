[package]
name = "horizon-mod-aei"
version = "0.1.5"
edition = "2024"
license = "MIT"
publish = false
description = "All Enough Items recipe and usage browser for Horizon, distributed as a native mod."

# The local crate root exposes the engine crate to rust-analyzer and tests.
[lib]
path = "src/lib.rs"

[dependencies]
aei-engine = { path = "mixins/aei/engine" }

[workspace]
members = [".", "mixins/aei/engine"]
resolver = "2"
