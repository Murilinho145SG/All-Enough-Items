# AEI development workspace.
#
# `mixins/aei/` is the bundle Horizon builds; its engine crate is self-contained
# (no `workspace = true` fields) because Horizon copies it out of this workspace.
# `xtask` holds the development commands: `cargo xtask check|package|ui-test`.
[workspace]
members = ["mixins/aei/engine", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.dev.package.xtask]
debug = false
